<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>凪 Nagi — JLPT N2 Study</title>
  <meta name="description" content="A calm, minimal companion for JLPT N2 study." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Modular CSS: design tokens load first, structural/component modules follow as they're built -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <rect x="2" y="2" width="44" height="44" rx="4" />
        <text x="24" y="25" dy="0.35em" text-anchor="middle" lang="ja">凪</text>
      </svg>
      <p class="brand__title">
        <span lang="ja">凪</span> <span class="brand__title-en">Nagi</span>
      </p>
    </div>

    <nav class="site-nav" aria-label="Primary">
      <ul class="site-nav__list">
        <li><a href="#dashboard" data-view="dashboard">Dashboard</a></li>
        <li><a href="#vocabulary" data-view="vocabulary">Vocabulary</a></li>
        <li><a href="#grammar" data-view="grammar">Grammar</a></li>
        <li><a href="#kanji" data-view="kanji">Kanji</a></li>
        <li><a href="#practice" data-view="practice">Practice</a></li>
        <li><a href="#journal" data-view="journal">Journal</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="app-main">
    <!-- One <section> per view. JS toggles the `hidden` attribute to switch between them. -->
    <section id="dashboard" class="view" aria-labelledby="dashboard-heading">
      <h1 id="dashboard-heading">Dashboard</h1>
    </section>

    <section id="vocabulary" class="view" hidden aria-labelledby="vocabulary-heading">
      <h1 id="vocabulary-heading">Vocabulary</h1>
    </section>

    <section id="grammar" class="view" hidden aria-labelledby="grammar-heading">
      <h1 id="grammar-heading">Grammar</h1>
    </section>

    <section id="kanji" class="view" hidden aria-labelledby="kanji-heading">
      <h1 id="kanji-heading">Kanji</h1>
    </section>

    <section id="practice" class="view" hidden aria-labelledby="practice-heading">
      <h1 id="practice-heading">Practice</h1>
    </section>

    <section id="journal" class="view" hidden aria-labelledby="journal-heading">
      <h1 id="journal-heading">Journal</h1>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Nagi — a personal JLPT N2 study companion.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
