<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ビグ Bigu — JLPT N2 Study</title>
  <meta name="description" content="A calm, minimal companion for JLPT N2 study." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Modular CSS: design tokens load first, structural/component modules follow as they're built -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <rect x="2" y="2" width="44" height="44" rx="4" />
        <text x="24" y="25" dy="0.35em" text-anchor="middle" lang="ja">ビグ</text>
      </svg>
      <p class="brand__title">
        <span lang="ja">ビグ</span> <span class="brand__title-en">Bigu</span>
      </p>
    </div>

    <div class="site-header__end">
      <nav class="site-nav" aria-label="Primary">
        <ul class="site-nav__list">
          <li><a href="#dashboard" data-view="dashboard">Dashboard</a></li>
          <li><a href="#vocabulary" data-view="vocabulary">Vocabulary</a></li>
          <li><a href="#grammar" data-view="grammar">Grammar</a></li>
          <li><a href="#kanji" data-view="kanji">Kanji</a></li>
          <li><a href="#practice" data-view="practice">Practice</a></li>
          <li><a href="#journal" data-view="journal">Journal</a></li>
          <li><a href="#lessons" data-view="lessons">Lessons</a></li>
        </ul>
      </nav>

      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" />
          <line x1="12" y1="2" x2="12" y2="5" />
          <line x1="12" y1="19" x2="12" y2="22" />
          <line x1="2" y1="12" x2="5" y2="12" />
          <line x1="19" y1="12" x2="22" y2="12" />
          <line x1="4.9" y1="4.9" x2="7" y2="7" />
          <line x1="17" y1="17" x2="19.1" y2="19.1" />
          <line x1="4.9" y1="19.1" x2="7" y2="17" />
          <line x1="17" y1="7" x2="19.1" y2="4.9" />
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
        </svg>
        <span class="sr-only">Toggle dark mode</span>
      </button>
    </div>
  </header>

  <main id="main-content" class="app-main">
    <!-- One <section> per view. JS toggles the `hidden` attribute to switch between them. -->
    <section id="dashboard" class="view" aria-labelledby="dashboard-heading">
      <h1 id="dashboard-heading">Dashboard</h1>
    </section>

    <section id="vocabulary" class="view" hidden aria-labelledby="vocabulary-heading">
      <h1 id="vocabulary-heading">Vocabulary</h1>
    </section>

    <section id="grammar" class="view" hidden aria-labelledby="grammar-heading">
      <h1 id="grammar-heading">Grammar</h1>
    </section>

    <section id="kanji" class="view" hidden aria-labelledby="kanji-heading">
      <h1 id="kanji-heading">Kanji</h1>
    </section>

    <section id="practice" class="view" hidden aria-labelledby="practice-heading">
      <h1 id="practice-heading">Practice</h1>
    </section>

    <section id="journal" class="view" hidden aria-labelledby="journal-heading">
      <h1 id="journal-heading">Journal</h1>
    </section>

    <section id="lessons" class="view" hidden aria-labelledby="lessons-heading">
      <h1 id="lessons-heading">Lessons</h1>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Bigu — a personal JLPT N2 study companion.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
