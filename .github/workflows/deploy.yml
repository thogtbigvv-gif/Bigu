# Publishes the site to GitHub Pages.
#
# This replaces GitHub's built-in "pages build and deployment" workflow, the
# one that runs automatically when Pages is set to deploy from a branch. Two
# reasons to own it instead:
#
#   1. That workflow runs the site through Jekyll. Bigu is plain HTML, CSS and
#      ES modules with nothing for Jekyll to do — it pulls a container, builds,
#      and produces the same files it was given. Uploading the directory
#      directly skips ~15 seconds and a whole class of "why did Jekyll touch
#      that file" surprises (it ignores anything starting with `_`).
#
#   2. A stalled deploy can be retried from the Actions tab. On 2026-08-06
#      GitHub's Pages deployment queue stalled for over an hour: builds
#      succeeded in 20 seconds and the deployment then sat unfinished until
#      the action gave up, on commit after commit, where a healthy deploy on
#      this repo takes about 6 seconds. The built-in workflow has no manual
#      trigger, so the only way to retry was to push an empty commit to main.
#      The `workflow_dispatch` below is that missing button.
#
#      What this does NOT fix: the ten-minute ceiling. deploy-pages caps its
#      own `timeout` input at 600000 ms and warns if you ask for more —
#      "timeout value is greater than the allowed maximum" — so a deployment
#      GitHub takes longer than ten minutes to process will fail here exactly
#      as it did there, and the action cancels it on the way out. When Pages
#      is having a bad day, no workflow config can save the run; only waiting
#      for GitHub can.
#
# REQUIRES: Settings → Pages → Source must be "GitHub Actions". While it is
# still "Deploy from a branch", this workflow cannot create a deployment and
# every run fails — the setting and this file have to land together.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a stalled or aborted deployment can be retried from the Actions tab
  # without pushing an empty commit, which is what the outage above forced.
  workflow_dispatch:

# Least privilege: read the repo, mint the OIDC token deploy-pages exchanges
# for its deployment, and write Pages itself. No contents: write anywhere.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs collapse to the latest, but an
# in-flight one is never cancelled — cancelling a production deploy halfway
# is worse than waiting for it, and with a 30-minute timeout below there is
# real waiting to protect.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The whole repository is the site — index.html sits at the root and
      # every asset is relative to it, so there is no build output directory
      # to point at. .git and .github are excluded by the action itself.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          # No `timeout` here on purpose. The action's default is 600000 ms
          # and that is also its hard maximum — passing anything larger is
          # silently clamped back down with a warning, so a longer budget is
          # not available to ask for. Lowering it would only fail sooner.
          #
          # Poll every 15s rather than the default 5s: over a ten-minute
          # ceiling that is 40 status requests instead of 120, to learn the
          # same one thing.
          reporting_interval: 15000
