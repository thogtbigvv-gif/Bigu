<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bigu">
  <!-- The app icon. Same geometry as the inline brand mark in index.html —
       speech bubble carrying ビ over an open book, two sparkles off its
       upper right — placed on the washi ground so the white bubble has
       something to sit against at 16px on a browser tab.

       The blues and the ground are literal here rather than tokens: an icon
       file is fetched outside the page, so it can't read css/variables.css,
       and a home-screen icon has to look the same whichever theme the
       reader is in. Keep #E9EBE4 in step with the color-washi token and
       #3b8bca with the mark in index.html if either ever changes.

       Rendered to PNG at 180/192/512 by tools/build-icons.py. -->
  <rect width="64" height="64" fill="#E9EBE4" />

  <g transform="translate(6.5 6.5) scale(0.79)">
    <path
      d="M51.6 43.1A27.5 27.5 0 1 0 38.4 54.7C44.1 57.4 49.6 59.2 55.6 60.6C54.1 54.6 52.9 48.9 51.6 43.1Z"
      fill="#fff"
      stroke="#D7D2C4"
      stroke-width="1"
    />

    <g fill="none" stroke="#3B8BCA" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.9 13.9V27.4C21.9 30.3 23.2 31.5 26.1 31.5H37.9" />
      <path d="M24.1 24.6L36.8 18" />
    </g>
