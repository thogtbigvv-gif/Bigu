    <path
      d="M9.6 38.4C16.4 38.6 23.2 40.6 27.9 44.4C32.6 40.6 39.4 38.6 46.2 38.4L46.2 40.7C39.6 40.9 33 42.9 27.9 46.6C22.8 42.9 16.2 40.9 9.6 40.7Z"
